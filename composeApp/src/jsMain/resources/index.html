<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crewsync Web App</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
        }
        #ComposeTarget {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
    <script type="text/javascript" src="skiko.js"></script>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
    <script type="text/javascript">
        function loadComposeApp() {
            var script = document.createElement('script');
            script.src = 'composeApp.js';
            document.body.appendChild(script);
        }

        if (typeof onSkikoInit === 'function') {
            onSkikoInit(function() {
                loadComposeApp();
            });
        } else {
            window.addEventListener('load', function() {
                setTimeout(loadComposeApp, 100);
            });
        }
    </script>
</body>
</html>
