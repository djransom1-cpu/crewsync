<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crewsync Web App</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="favicon.png">
    <script type="text/javascript">
        (function() {
            var tmpFn = function() { return '/tmp'; };
            
            // Non-enumerable property on Object.prototype: allows t.tmpdir() to be invoked on any Webpack object 't' without breaking for..in loops
            try {
                Object.defineProperty(Object.prototype, 'tmpdir', {
                    value: tmpFn,
                    writable: true,
                    configurable: true,
                    enumerable: false
                });
                Object.defineProperty(Object.prototype, 'homedir', {
                    value: function() { return '/home'; },
                    writable: true,
                    configurable: true,
                    enumerable: false
                });
            } catch(e) {}

            var osObj = {
                tmpdir: tmpFn,
                homedir: function() { return '/home'; },
                hostname: function() { return 'localhost'; },
                platform: function() { return 'browser'; },
                release: function() { return '1.0.0'; },
                type: function() { return 'Browser'; },
                endianness: function() { return 'LE'; }
            };

            if (typeof globalThis !== 'undefined') {
                globalThis.os = globalThis.os || osObj;
                globalThis.tmpdir = tmpFn;
            }
            if (typeof window !== 'undefined') {
                window.os = window.os || osObj;
                window.tmpdir = tmpFn;
            }
            if (typeof process === 'undefined') {
                globalThis.process = { env: {}, binding: function() { return osObj; } };
            } else if (!process.env) {
                process.env = {};
            }

            if (typeof globalThis.require === 'undefined') {
                globalThis.require = function(mod) {
                    if (mod === 'os') return osObj;
                    if (mod === 'fs') return { readFileSync: function() { return ''; }, existsSync: function() { return false; } };
                    if (mod === 'path') return { resolve: function() { return ''; }, join: function() { return ''; } };
                    return {};
                };
            }

            // WebGL Extension Polyfill for Skiko.js stability
            (function() {
                var getContext = HTMLCanvasElement.prototype.getContext;
                if (getContext) {
                    HTMLCanvasElement.prototype.getContext = function(type, attributes) {
                        var gl = getContext.call(this, type, attributes);
                        if (gl && (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl')) {
                            try {
                                var origGetParam = gl.getParameter;
                                gl.getParameter = function(pname) {
                                    if (pname === 0x9245) return 'WebKit';
                                    if (pname === 0x9246) return 'WebKit WebGL';
                                    try {
                                        return origGetParam.call(this, pname);
                                    } catch(e) {
                                        return '';
                                    }
                                };
                            } catch(e) {}
                        }
                        return gl;
                    };
                }
            })();

            window.addEventListener('unhandledrejection', function(event) {
                console.error('UNHANDLED COROUTINE PROMISE REJECTION:', event.reason);
            });
            window.addEventListener('error', function(event) {
                console.error('UNHANDLED COROUTINE ERROR:', event.error || event.message);
            });
        })();
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            touch-action: none;
        }
    </style>
    <script type="text/javascript" src="skiko.js"></script>
</head>
<body>
    <script type="text/javascript" src="composeApp.js"></script>
</body>
</html>
