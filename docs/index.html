<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crewsync Web App</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="favicon.png">
    <script type="text/javascript">
        (function() {
            if (typeof globalThis.process === 'undefined') {
                globalThis.process = { env: {} };
            }
            if (typeof globalThis.process.env === 'undefined') {
                globalThis.process.env = {};
            }
            try {
                Object.defineProperty(Object.prototype, 'tmpdir', {
                    value: function() { return '/tmp'; },
                    enumerable: false,
                    writable: true,
                    configurable: true
                });
                Object.defineProperty(Object.prototype, 'homedir', {
                    value: function() { return '/home'; },
                    enumerable: false,
                    writable: true,
                    configurable: true
                });
            } catch(e) {}
            
            window.addEventListener('unhandledrejection', function(event) {
                console.error('UNHANDLED COROUTINE PROMISE REJECTION:', event.reason);
            });
            window.addEventListener('error', function(event) {
                console.error('UNHANDLED COROUTINE ERROR:', event.error || event.message);
            });
        })();
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            touch-action: none;
        }
    </style>
    <script type="text/javascript" src="skiko.js"></script>
</head>
<body>
    <script type="text/javascript" src="composeApp.js"></script>
</body>
</html>
