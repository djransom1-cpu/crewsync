<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crewsync Web App</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="favicon.png">
    <script type="text/javascript">
        if (typeof globalThis.os === 'undefined') {
            globalThis.os = { tmpdir: function() { return '/tmp'; } };
        } else if (typeof globalThis.os.tmpdir === 'undefined') {
            globalThis.os.tmpdir = function() { return '/tmp'; };
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            touch-action: none;
        }
    </style>
    <script type="text/javascript" src="skiko.js"></script>
</head>
<body>
    <script type="text/javascript" src="composeApp.js"></script>
</body>
</html>
