name: Build & Deploy CrewSync Web App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy-web:
    name: 🌐 Build & Deploy CrewSync Web App
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: 🔧 Grant Executable Permissions to Gradlew
      run: chmod +x gradlew

    - name: 🛠️ Build Web App JS Distribution
      run: ./gradlew :composeApp:jsBrowserDistribution

    - name: 🚀 Deploy Web App to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./composeApp/build/dist/js/productionExecutable
