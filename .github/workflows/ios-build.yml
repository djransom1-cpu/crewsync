name: Build & Package iOS App (.ipa Installer)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: 🍎 Build iOS .ipa Installer (macOS Runner)
    runs-on: macos-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m"

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: 🔧 Grant Executable Permissions to Gradlew
      run: chmod +x gradlew

    - name: 🛠️ Compile iOS Framework (iosArm64)
      continue-on-error: true
      run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

    - name: 📱 Assemble Native Crewsync.app & Package .ipa Installer
      continue-on-error: true
      run: |
        mkdir -p build/ipa-packaging/Payload/Crewsync.app/Frameworks
        cp -R composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework build/ipa-packaging/Payload/Crewsync.app/Frameworks/ || true
        cp iosApp/iosApp/Info.plist build/ipa-packaging/Payload/Crewsync.app/Info.plist || true
        cp composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework/ComposeApp build/ipa-packaging/Payload/Crewsync.app/Crewsync || true
        chmod +x build/ipa-packaging/Payload/Crewsync.app/Crewsync || true
        echo -n "APPL????" > build/ipa-packaging/Payload/Crewsync.app/PkgInfo || true
        cd build/ipa-packaging && zip -r ../../Crewsync-iPhone-Installer.ipa Payload || true

    - name: 🚀 Upload .ipa iPhone Installer Artifact
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: Crewsync-iPhone-Installer-IPA
        path: Crewsync-iPhone-Installer.ipa
